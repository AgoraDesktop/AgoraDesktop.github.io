<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: #f2f0ff;
    background-color: #07060d;
    background-image:
      radial-gradient(120% 90% at 14% -10%, #3b2a7a 0%, transparent 58%),
      radial-gradient(100% 80% at 88% 4%, #0e4a6e 0%, transparent 54%),
      radial-gradient(130% 105% at 50% 112%, #6b2a6e 0%, transparent 62%);
    background-attachment: fixed;
  }
  @media (prefers-color-scheme: light) {
    body {
      color: #17142a;
      background-color: #dfe5f5;
      background-image:
        radial-gradient(120% 90% at 14% -10%, #bcd0ff 0%, transparent 58%),
        radial-gradient(100% 80% at 88% 4%, #ffd9c2 0%, transparent 54%),
        radial-gradient(130% 105% at 50% 112%, #e3c6ff 0%, transparent 62%);
    }
  }
  h1 { font-size: clamp(3rem, 12vw, 5rem); margin: 0 0 .25rem; letter-spacing: -.03em; }
  p { margin: 0 auto 2rem; max-width: 26rem; opacity: .75; }
  a {
    display: inline-block;
    padding: .6rem 1.15rem;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    color: #17102e;
    background: #a48bff;
  }
  a:hover { filter: brightness(1.08); }
  code { font-size: .9em; opacity: .8; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>
      There is nothing at <code id="path">this address</code> — the site is still
      being built.
    </p>
    <a href="/">Back to the front page</a>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
